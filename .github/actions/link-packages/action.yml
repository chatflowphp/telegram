name: Link chatflowphp packages
description: >
  Until chatflowphp/automata 2.x and chatflowphp/core 2.x are published on Packagist, clone
  them next to the checkout and register them as Composer path repositories. The branch matching
  the current ref is preferred, then "v2", then the default branch.

runs:
  using: composite
  steps:
    - name: Clone and register path repositories
      shell: bash
      run: |
        set -euo pipefail

        current="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"

        link() {
          local name="$1" repo="$2" dir="$3" target=""

          for candidate in "$current" "v2"; do
            if git ls-remote --exit-code --heads "$repo" "$candidate" >/dev/null 2>&1; then
              target="$candidate"
              break
            fi
          done

          if [ -n "$target" ]; then
            git clone --depth=1 --branch "$target" "$repo" "$dir"
          else
            git clone --depth=1 "$repo" "$dir"
          fi

          composer config "repositories.$name" \
            "{\"type\":\"path\",\"url\":\"$dir\",\"options\":{\"symlink\":false,\"versions\":{\"chatflowphp/$name\":\"2.0.0\"}}}"
        }

        link automata https://github.com/chatflowphp/automata.git ../chatflow-automata
        link core https://github.com/chatflowphp/core.git ../chatflow-core
